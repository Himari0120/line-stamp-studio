<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LINEスタンプメーカー</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;padding:16px 16px 88px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px 4px;border:none;border-radius:8px;background:#334155;color:#fff;font-weight:bold}
.tab.on{background:#06c755}
.box{background:#1e293b;padding:14px;border-radius:12px;margin-bottom:12px}
.panel{display:none}
.panel.on{display:block}
canvas{display:block;width:100%;max-width:340px;margin:0 auto;border-radius:8px}
.bg-light{background:#f8fafc}
.bg-dark{background:#111827}
.btn{padding:11px 14px;border:none;border-radius:8px;background:#06c755;color:#fff;font-weight:bold;font-size:15px}
.btn2{padding:11px 14px;border:none;border-radius:8px;background:#475569;color:#fff;font-weight:bold;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0f172a;padding:10px 16px;display:flex;justify-content:space-between;border-top:1px solid #334155}
input[type="file"],input[type="text"],select{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:none;font-size:16px;box-sizing:border-box;color:#0f172a;background:#fff}
input[type="range"]{width:100%;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
.slot-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.slot-row select{width:auto;min-width:130px;margin-top:0}
.slot-row input{flex:1;margin-top:0}
.note{font-size:13px;color:#cbd5e1;margin-top:8px;line-height:1.5}
.lbl-block{display:block;margin-top:14px}
</style>
</head>
<body>
<h3>LINEスタンプメーカー（サイズ・余白・フチ調整）</h3>

<div class="tabs">
  <button type="button" class="tab on" id="tab1" onclick="go(1)">1.画像</button>
  <button type="button" class="tab" id="tab2" onclick="go(2)">2.動き/余白</button>
  <button type="button" class="tab" id="tab3" onclick="go(3)">3.40個/文字</button>
  <button type="button" class="tab" id="tab4" onclick="go(4)">4.サイズ/保存</button>
</div>

<div class="box">
  <canvas id="cv" width="340" height="280" class="bg-light"></canvas>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button type="button" class="btn2" onclick="toggleBg()">プレビュー背景 白/黒</button>
    <span id="curBadge" style="font-weight:bold;color:#38bdf8">#01</span>
    <span id="szBadge" style="font-size:13px;color:#cbd5e1">出力: 320×270</span>
  </div>
  <p id="info" style="color:#34d399;margin:8px 0 0">ステップ1：画像を選んでください</p>
</div>

<div class="box panel on" id="p1">
  <label>画像を選ぶ</label>
  <input type="file" accept="image/*" onchange="loadPic(this)">
  <label class="chk">
    <input type="checkbox" id="keyOn" checked onchange="makeKey()">
    <span>左上（角）と同じ背景色を自動透過する</span>
  </label>
  <label class="lbl-block">透過の強さ: <span id="tolLbl">50</span>
    <input type="range" id="tolR" min="0" max="160" value="50" oninput="setTol(this.value)">
  </label>
</div>

<div class="box panel" id="p2">
  <label>選択中スタンプの動き</label>
  <select id="act" onchange="setSlotMotion(this.value)">
    <option value="bounce">ぴょん跳ね</option>
    <option value="float">ふわふわ</option>
    <option value="swing">ゆらゆら</option>
    <option value="jelly">ぷるぷる</option>
    <option value="pulse">ドキドキ拡大</option>
  </select>
  <label class="lbl-block">キャラの拡大率（%）: <span id="scLbl">100</span>
    <input type="range" id="scR" min="40" max="180" value="100" oninput="setScale(this.value)">
  </label>
  <label class="lbl-block">外側の余白（%）: <span id="padLbl">12</span>
    <input type="range" id="padR" min="4" max="30" value="12" oninput="setPad(this.value)">
  </label>
</div>

<div class="box panel" id="p3">
  <label>スタンプ番号を選ぶ（#01〜#40）</label>
  <select id="slotPick" onchange="pickSlot(this.value)"></select>
  <div class="slot-row">
    <input type="text" id="say" value="おはよう！" oninput="setSlotText(this.value)">
    <select id="slotAct" onchange="setSlotMotion(this.value)">
      <option value="bounce">ぴょん跳ね</option>
      <option value="float">ふわふわ</option>
      <option value="swing">ゆらゆら</option>
      <option value="jelly">ぷるぷる</option>
      <option value="pulse">ドキドキ拡大</option>
    </select>
  </div>
  <label class="lbl-block">文字サイズ（%）: <span id="fntLbl">100</span>
    <input type="range" id="fntR" min="60" max="140" value="100" oninput="setFontScale(this.value)">
  </label>
  <label class="lbl-block">白フチの太さ: <span id="outLbl">8</span>
    <input type="range" id="outR" min="2" max="16" value="8" oninput="setOutline(this.value)">
  </label>
  <p class="note">白フチを太くすると、トーク画面の背景が白でも黒でも文字が読みやすくなります。</p>
</div>

<div class="box panel" id="p4">
  <label>書き出しサイズ（幅×高さ）</label>
  <select id="outSize" onchange="setOutSize(this.value)">
    <option value="320x270" selected>320 × 270（アニメ目安）</option>
    <option value="370x320">370 × 320（静止画目安）</option>
    <option value="240x240">240 × 240（正方形）</option>
    <option value="512x512">512 × 512（高精細プレビュー・素材用）</option>
  </select>
  <label class="lbl-block">1スタンプあたりの連番枚数</label>
  <select id="frameCnt" onchange="frameTotal=Number(this.value)">
    <option value="4">4枚</option>
    <option value="6" selected>6枚</option>
    <option value="8">8枚</option>
    <option value="10">10枚</option>
  </select>
  <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
    <button type="button" class="btn" onclick="saveCurrentSeq()">選択中（#01〜#40）を連番PNG保存</button>
    <button type="button" class="btn2" id="allBtn" onclick="saveAll40Seq()">全40スタンプを順番に連番PNG保存</button>
  </div>
</div>

<div class="bar">
  <button type="button" class="btn2" onclick="go(cur>1?cur-1:4)">← 前へ</button>
  <button type="button" class="btn" onclick="go(cur<4?cur+1:1)">次へ →</button>
</div>

<script>
var PHRASES=[
  "おはよう！","ありがとう！","了解です！","おつかれさま","おやすみ〜","わーい！！","えっ！？","ごめんなさい","いいね！","よろしくね",
  "はーい！","なるほど！","うそでしょ!?","照れるなぁ","大好き♡","ふふっ♪","最高！！","無理…","ガンバレ！","やったね！",
  "ペコリ","ワクワク","眠い…","ガーン！","OK！","まっててね","急ぎます！","助かりました","神！！","えーん泣",
  "それな！","尊い…","またね〜","おめでとう！","ほっ…","なんでやねん","ぺこぺこ","ルンルン♪","ちーん…","感謝感激！"
];
var MOTIONS=["bounce","float","swing","jelly","pulse"];
var slots=[];
for(var i=0;i<40;i++){
  slots.push({text:PHRASES[i]||("スタンプ"+(i+1)), motion:MOTIONS[i%MOTIONS.length]});
}

var cur=1, sel=0, pic=null, keyPic=null, t=0, tolVal=50, darkBg=false;
var scVal=1.0, padPct=12, fontScale=1.0, outlineW=8;
var outW=320, outH=270, frameTotal=6, busyAll=false;

function initSlotSelect(){
  var el=document.getElementById("slotPick");
  el.innerHTML="";
  for(var i=0;i<40;i++){
    var opt=document.createElement("option");
    opt.value=String(i);
    opt.textContent="#"+String(i+1).padStart(2,"0")+" : "+slots[i].text;
    if(i===sel) opt.selected=true;
    el.appendChild(opt);
  }
  syncSlotControls();
  updateSizeBadge();
}

function syncSlotControls(){
  var sl=slots[sel];
  document.getElementById("curBadge").textContent="#"+String(sel+1).padStart(2,"0")+"（"+sl.text+"）";
  document.getElementById("say").value=sl.text;
  document.getElementById("slotAct").value=sl.motion;
  document.getElementById("act").value=sl.motion;
}

function updateSizeBadge(){
  document.getElementById("szBadge").textContent="出力: "+outW+"×"+outH;
}

function setOutSize(val){
  var parts=String(val).split("x");
  outW=Number(parts[0])||320;
  outH=Number(parts[1])||270;
  updateSizeBadge();
  document.getElementById("info").textContent="書き出しサイズを "+outW+"×"+outH+" に設定しました";
}

function pickSlot(idxStr){
  sel=Math.max(0,Math.min(39,Number(idxStr)||0));
  syncSlotControls();
  document.getElementById("info").textContent="#"+String(sel+1).padStart(2,"0")+" を選択中";
}

function setSlotText(v){
  slots[sel].text=v;
  var pick=document.getElementById("slotPick");
  if(pick.options[sel]){
    pick.options[sel].textContent="#"+String(sel+1).padStart(2,"0")+" : "+v;
  }
  document.getElementById("curBadge").textContent="#"+String(sel+1).padStart(2,"0")+"（"+v+"）";
}

function setSlotMotion(m){
  slots[sel].motion=m;
  document.getElementById("slotAct").value=m;
  document.getElementById("act").value=m;
}

function go(n){
  cur=n;
  for(var i=1;i<=4;i++){
    document.getElementById("tab"+i).className=(i===n)?"tab on":"tab";
    document.getElementById("p"+i).className=(i===n)?"box panel on":"box panel";
  }
  syncSlotControls();
  document.getElementById("info").textContent="ステップ"+n+"を表示中";
}

function toggleBg(){
  darkBg=!darkBg;
  document.getElementById("cv").className=darkBg?"bg-dark":"bg-light";
}

function setScale(v){
  scVal=Number(v)/100;
  document.getElementById("scLbl").textContent=v;
}

function setPad(v){
  padPct=Number(v);
  document.getElementById("padLbl").textContent=v;
}

function setFontScale(v){
  fontScale=Number(v)/100;
  document.getElementById("fntLbl").textContent=v;
}

function setOutline(v){
  outlineW=Number(v);
  document.getElementById("outLbl").textContent=v;
}

function makeKey(){
  if(!pic){keyPic=null;return;}
  var on=document.getElementById("keyOn").checked;
  if(!on){keyPic=null;document.getElementById("info").textContent="透過OFFで表示中";return;}
  try{
    var off=document.createElement("canvas");
    off.width=pic.naturalWidth||pic.width;
    off.height=pic.naturalHeight||pic.height;
    var o=off.getContext("2d");
    o.drawImage(pic,0,0);
    var id=o.getImageData(0,0,off.width,off.height), d=id.data;
    var r=d[0], g=d[1], b=d[2], lim=Number(tolVal), hit=0;
    for(var i=0;i<d.length;i+=4){
      if(Math.abs(d[i]-r)<=lim && Math.abs(d[i+1]-g)<=lim && Math.abs(d[i+2]-b)<=lim){
        d[i+3]=0;
        hit++;
      }
    }
    o.putImageData(id,0,0);
    keyPic=off;
    var pct=Math.round((hit/(d.length/4))*100);
    document.getElementById("info").textContent="透過処理完了（約"+pct+"%のピクセルを透過）";
  }catch(err){
    keyPic=null;
    document.getElementById("info").textContent="透過できませんでした: "+err.message;
  }
}

function setTol(v){
  tolVal=Number(v);
  document.getElementById("tolLbl").textContent=v;
  makeKey();
}

function loadPic(inp){
  if(!inp.files||!inp.files[0])return;
  var f=inp.files[0], r=new FileReader();
  r.onload=function(e){
    var im=new Image();
    im.onload=function(){
      pic=im;
      makeKey();
      if(!keyPic){
        document.getElementById("info").textContent="読み込みOK（元画像を表示）: "+f.name;
      }
    };
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}

function renderFrame(ctx, wCanvas, hCanvas, phase, slotIdx, forceLightText){
  ctx.clearRect(0,0,wCanvas,hCanvas);
  var sl=slots[slotIdx]||{text:"",motion:"bounce"};
  var scaleRatio=Math.min(wCanvas/340, hCanvas/280);

  var padX=wCanvas*(padPct/100);
  var padY=hCanvas*(padPct/100);
  var textReserve=(sl.text ? hCanvas*0.22 : 0);
  var availW=Math.max(40, wCanvas - padX*2);
  var availH=Math.max(40, hCanvas - padY*2 - textReserve);

  var dx=0, dy=0, rot=0, sx=scVal, sy=scVal;
  var ampY=14*scaleRatio;
  var ampFloat=10*scaleRatio;
  if(sl.motion==="bounce") dy=-Math.abs(Math.sin(phase))*ampY;
  if(sl.motion==="float") dy=Math.sin(phase)*ampFloat;
  if(sl.motion==="swing") rot=Math.sin(phase)*0.2;
  if(sl.motion==="jelly"){sx=scVal*(1+Math.sin(phase*2)*0.12);sy=scVal*(1-Math.sin(phase*2)*0.12);}
  if(sl.motion==="pulse"){var p=1+Math.sin(phase)*0.14;sx=scVal*p;sy=scVal*p;}

  var centerX=wCanvas/2;
  var centerY=padY + availH/2 + ampY*0.35;

  var showPic=keyPic||pic;
  if(showPic){
    var iw=showPic.width||1, ih=showPic.height||1;
    var fitScale=Math.min(availW/iw, availH/ih);
    var drawW=iw*fitScale;
    var drawH=ih*fitScale;
    ctx.save();
    ctx.translate(centerX+dx, centerY+dy);
    ctx.rotate(rot);
    ctx.scale(sx, sy);
    ctx.drawImage(showPic, -drawW/2, -drawH/2, drawW, drawH);
    ctx.restore();
  }else{
    ctx.fillStyle="#64748b";
    ctx.font="bold "+Math.max(12,Math.round(14*scaleRatio))+"px sans-serif";
    ctx.textAlign="center";
    ctx.fillText("1.画像 から画像を選んでね", centerX, centerY);
  }

  if(sl.text){
    var fSize=Math.max(14, Math.round(26*scaleRatio*fontScale));
    var strokePx=Math.max(2, Math.round(outlineW*scaleRatio));
    var textY=hCanvas - Math.max(8, padY*0.55);
    ctx.save();
    ctx.font="900 "+fSize+"px sans-serif";
    ctx.textAlign="center";
    ctx.textBaseline="alphabetic";
    ctx.lineJoin="round";
    ctx.lineWidth=strokePx;
    ctx.strokeStyle="#ffffff";
    ctx.strokeText(sl.text, centerX, textY);
    ctx.fillStyle=(!forceLightText && darkBg)?"#ffffff":"#0f172a";
    ctx.fillText(sl.text, centerX, textY);
    ctx.restore();
  }
}

function downloadDataUrl(url, filename){
  var a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function saveSlotSeq(slotIdx){
  var total=Math.max(2,Number(frameTotal)||6);
  var off=document.createElement("canvas");
  off.width=outW;
  off.height=outH;
  var octx=off.getContext("2d");
  var prefix="stamp_"+String(slotIdx+1).padStart(2,"0")+"_"+outW+"x"+outH;
  for(var f=0;f<total;f++){
    var ph=(f/total)*Math.PI*2;
    renderFrame(octx,outW,outH,ph,slotIdx,true);
    var fname=prefix+"_f"+String(f+1).padStart(2,"0")+".png";
    downloadDataUrl(off.toDataURL("image/png"),fname);
  }
}

function saveCurrentSeq(){
  saveSlotSeq(sel);
  document.getElementById("info").textContent="#"+String(sel+1).padStart(2,"0")+"（"+outW+"×"+outH+"）の連番PNG（"+frameTotal+"枚）を保存しました";
}

function saveAll40Seq(){
  if(busyAll) return;
  busyAll=true;
  var btn=document.getElementById("allBtn");
  btn.disabled=true;
  var idx=0;
  function stepNext(){
    if(idx>=40){
      busyAll=false;
      btn.disabled=false;
      document.getElementById("info").textContent="全40スタンプ（"+outW+"×"+outH+"）の連番PNG書き出しが完了しました！";
      return;
    }
    sel=idx;
    syncSlotControls();
    saveSlotSeq(idx);
    document.getElementById("info").textContent="書き出し中: #"+String(idx+1).padStart(2,"0")+" / 40";
    idx++;
    setTimeout(stepNext, 220);
  }
  stepNext();
}

function loop(){
  var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
  t+=0.1;
  renderFrame(ctx,cv.width,cv.height,t,sel,false);
  requestAnimationFrame(loop);
}

initSlotSelect();
loop();
</script>
</body>
</html>
