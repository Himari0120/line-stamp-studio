<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LINE 40-Stamp Motion Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-light: #334155;
      --accent: #06c755;
      --accent-hover: #05b34c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 72px;
    }
    header {
      background: var(--panel);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    header h1 {
      font-size: 0.98rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: bold;
    }

    /* ウィザード・ステップバー */
    .stepper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 8px 10px;
      background: #131c31;
      border-bottom: 1px solid var(--border);
    }
    .step-tab {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 4px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .step-tab .step-num {
      display: inline-block;
      width: 18px;
      height: 18px;
      line-height: 18px;
      border-radius: 50%;
      background: var(--panel-light);
      color: var(--text);
      font-size: 0.68rem;
    }
    .step-tab.active {
      border-color: var(--accent);
      background: #064e3b;
      color: #fff;
    }
    .step-tab.active .step-num {
      background: var(--accent);
      color: #fff;
    }
    .step-tab.done .step-num {
      background: #10b981;
      color: #fff;
    }

    /* メインレイアウト */
    .main-container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 12px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 860px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    /* 常時表示プレビューカード */
    .preview-card {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 8px;
      z-index: 10;
    }
    @media (max-width: 860px) {
      .preview-card {
        position: relative;
        top: 0;
      }
    }
    .canvas-checker {
      background-image:
        linear-gradient(45deg, #cbd5e1 25%, transparent 25%),
        linear-gradient(-45deg, #cbd5e1 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #cbd5e1 75%),
        linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-color: #f1f5f9;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      line-height: 0;
      touch-action: none;
    }
    canvas {
      max-width: 100%;
      height: auto;
      cursor: grab;
      touch-action: none;
    }

    /* ステップパネル */
    .wizard-panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.2s ease;
    }
    .wizard-panel.active {
      display: flex;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .step-header h2 {
      font-size: 1rem;
      margin: 0
    .step-header p { font-size: 0.8rem; color: var(--muted); margin: 0; }
    .control-row { display: flex; flex-direction: column; gap: 6px; }
    .control-row label { font-size: 0.82rem; font-weight: 600; display: flex; justify-content: space-between; }
    input[type="file"], input[type="text"], input[type="number"], select {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 0.88rem;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .btn {
      padding: 10px 14px; border-radius: 8px; border: none; font-weight: 700;
      font-size: 0.88rem; cursor: pointer; background: var(--panel-light); color: var(--text);
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .slot-list {
      max-height: 340px; overflow-y: auto; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px;
    }
    .slot-item {
      background: #0f172a; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; display: flex; flex-direction: column; gap: 6px;
    }
    .slot-item.selected { border-color: var(--accent); background: #062e1e; }
    .slot-num { font-size: 0.72rem; color: var(--muted); font-weight: 700; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a;
      border-top: 1px solid var(--border); padding: 10px 14px;
      display: flex; justify-content: space-between; gap: 10px; z-index: 20;
    }
    .status-msg { font-size: 0.8rem; color: #34d399; min-height: 1.2em; }
  </style>
</head>
<body>
  <header>
    <h1 id="appTitle">
      <span id="titleText">LINE 40-Stamp Motion Studio</span>
      <span class="badge" id="badgeText">ステップ式ウィザード</span>
    </h1>
  </header>
  <nav class="stepper" id="stepper">
    <button type="button" class="step-tab active" data-step="1">1. 画像・透過</button>
    <button type="button" class="step-tab" data-step="2">2. 配置・動き</button>
    <button type="button" class="step-tab" data-step="3">3. 40セリフ</button>
    <button type="button" class="step-tab" data-step="4">4. 連番書き出し</button>
  </nav>
  <main class="main-container">
    <section class="preview-card">
      <div class="canvas-checker">
        <canvas id="studioCanvas" width="370" height="320"></canvas>
      </div>
      <div class="hint">ドラッグで位置調整</div>
      <div class="btn-row">
        <button type="button" class="btn" id="togglePlayBtn">再生 / 一時停止</button>
        <button type="button" class="btn" id="resetPosBtn">位置リセット</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </section>
    <section class="wizard-panel active" id="panel-1">
      <div class="step-header"><h2>Step 1: 画像読み込み＆背景透過</h2><p>画像を選び、背景色を透過します。</p></div>
      <div class="control-row"><label for="imageInput">元画像を選択</label><input type="file" id="imageInput" accept="image/*" /></div>
      <div class="control-row"><label><input type="checkbox" id="enableKeying" checked /> 角の色を自動透過する</label></div>
      <div class="control-row"><label for="toleranceRange">許容値: <span id="toleranceVal">35</span></label><input type="range" id="toleranceRange" min="0" max="140" value="35" /></div>
      <div class="control-row"><label><input type="checkbox" id
  <script>
    (() => {
      const PRESET_40 = [
        { text: "おはよう！", motion: "bounce" }, { text: "ありがとう！", motion: "bow" },
        { text: "了解です！", motion: "nod" }, { text: "おつかれさま", motion: "bow" },
        { text: "おやすみ〜", motion: "float" }, { text: "わーい！！", motion: "bounce" },
        { text: "えっ！？", motion: "shock" }, { text: "ごめんなさい", motion: "droop" },
        { text: "いいね！", motion: "pulse" }, { text: "よろしくね", motion: "bow" },
        { text: "はーい！", motion: "bounce" }, { text: "なるほど！", motion: "nod" },
        { text: "うそでしょ!?", motion: "shock" }, { text: "照れるなぁ", motion: "jelly" },
        { text: "大好き♡", motion: "pulse" }, { text: "ふふっ♪", motion: "jelly" },
        { text: "最高！！", motion: "spin" }, { text: "無理…", motion: "droop" },
        { text: "ガンバレ！", motion: "pulse" }, { text: "やったね！", motion: "bounce" },
        { text: "ペコリ", motion: "bow" }, { text: "ワクワク", motion: "jelly" },
        { text: "眠い…", motion: "float" }, { text: "ガーン！", motion: "shock" },
        { text: "OK！", motion: "swing" }, { text: "まっててね", motion: "swing" },
        { text: "急ぎます！", motion: "shock" }, { text: "助かりました", motion: "bow" },
        { text: "神！！", motion: "spin" }, { text: "えーん泣", motion: "droop" },
        { text: "それな！", motion: "nod" }, { text: "尊い…", motion: "pulse" },
        { text: "またね〜", motion: "swing" }, { text: "おめでとう！", motion: "spin" },
        { text: "ほっ…", motion: "float" }, { text: "なんでやねん", motion: "shock" },
        { text: "ぺこぺこ", motion: "bow" }, { text: "ルンルン♪", motion: "swing" },
        { text: "ちーん…", motion: "droop" }, { text: "感謝感激！", motion: "bounce" }
      ];

      const MOTIONS = ["bounce", "bow", "nod", "float", "shock", "droop", "pulse", "jelly", "spin", "swing"];
      const MOTION_LABELS = {
        bounce: "ぴょん跳ね", bow: "ぺこり", nod: "うなずき", float: "ふわふわ",
        shock: "ガーン振動", droop: "しょんぼり", pulse: "ドキドキ拡大", jelly: "ぷるぷる",
        spin: "くるりん", swing: "ゆらゆら"
      };

      const canvas = document.getElementById("studioCanvas");
      const ctx = canvas.getContext("2d");

      const state = {
        step: 1,
        selectedSlot: 0,
        isPlaying: true,
        tick: 0,
        img: null,
        keyedCanvas: null,
        posX: canvas.width / 2,
        posY: canvas.height / 2 - 12,
        scale: 1.0,
        dragging: false,
        dragStartX: 0,
        dragStartY: 0,
        enableKeying: true,
        tolerance: 35,
        showMarginGuide: true,
        speed: 1.0,
        amp: 1.0,
        captionColor: "#1e293b",
        captionSize: 32,
        framesPerStamp: 10,
        slots: Array.from({ length: 40 }, (_, i) => PRESET_40[i] || { text: `スタンプ${i + 1}`, motion: "bounce" })
      };

      const statusMsg = document.getElementById("statusMsg");
      const setStatus = msg => { if (statusMsg) statusMsg.textContent = msg; };

      function goToStep(stepNum) {
        state.step = Math.max(1, Math.min(4, stepNum));
        document.querySelectorAll(".step-tab").forEach(tab => {
          tab.classList.toggle("active", Number(tab.dataset.step) === state.step);
        });
        document.querySelectorAll(".wizard-panel").forEach(panel => {
          panel.classList.toggle("active", panel.id === `panel-${state.step}`);
        });
        document.getElementById("prevStepBtn").disabled = state.step === 1;
        document.getElementById("nextStepBtn").textContent = state.step === 4 ? "完了" : "次へ →";
      }

      document.querySelectorAll(".step-tab").forEach(tab => {
        tab.addEventListener("click", () => goToStep(Number(tab.dataset.step)));
      });
      document.getElementById("prevStepBtn").addEventListener("click", () => goToStep(state.step - 1));
      document.getElementById("nextStepBtn").addEventListener("click", () => {
        if (state.step < 4) goToStep(state.step + 1);
        else setStatus("Step 4 から連番PNGを書き出せます！");
      });

      function rebuildKeyedImage() {
        if (!state.img) { state.keyedCanvas = null; return; }
        const off = document.createElement("canvas");
        off.width = state.img.naturalWidth || state.img.width;
        off.height = state.img.naturalHeight || state.img.height;
        const octx = off.getContext("2d");
        octx.drawImage(state.img, 0, 0);
        if (state.enableKeying && off.width > 0 && off.height > 0) {
          const imgData = octx.getImageData(0, 0, off.width, off.height);
          const d = imgData.data;
          const [bgR, bgG, bgB] = [d[0], d[1], d[2]];
          const tol = state.tolerance;
          for (let i = 0; i < d.length; i += 4) {
            if (Math.abs(d[i] - bgR) <= tol && Math.abs(d[i + 1] - bgG) <= tol && Math.abs(d[i + 2] - bgB) <= tol) {
              d[i + 3] = 0;
            }
          }
          octx.putImageData(imgData, 0, 0);
        }
        state.keyedCanvas = off;
      }

      document.getElementById("imageInput").addEventListener("change", e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            state.img = img;
            state.posX = canvas.width / 2;
            state.posY = canvas.height / 2 - 12;
            rebuildKeyedImage();
            setStatus(`読み込み完了: ${file.name}`);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      document.getElementById("enableKeying").addEventListener("change", e => {
        state.enableKeying = e.target.checked;
        rebuildKeyedImage();
      });
      document.getElementById("toleranceRange").addEventListener("input", e => {
        state.tolerance = Number(e.target.value);
        document.getElementById("toleranceVal").textContent = state.tolerance;
        rebuildKeyedImage();
      });
      document.getElementById("showMarginGuide").addEventListener("change", e => {
        state.showMarginGuide = e.target.checked;
      });
      document.getElementById("scaleRange").addEventListener("input", e => {
        state.scale = Number(e.target.value) / 100;
        document.getElementById("scaleVal").textContent = `${e.target.value}%`;
      });
      document.getElementById("speedRange").addEventListener("input", e => {
        state.speed = Number(e.target.value);
        document.getElementById("speedVal").textContent = state.speed.toFixed(1);
      });
      document.getElementById("ampRange").addEventListener("input", e => {
        state.amp = Number(e.target.value);
        document.getElementById("ampVal").textContent = state.amp.toFixed(1);
      });
      document.getElementById("captionColor").addEventListener("input", e => {
        state.captionColor = e.target.value;
      });
      document.getElementById("captionSize").addEventListener("input", e => {
        state.captionSize = Number(e.target.value);
        document.getElementById("captionSizeVal").textContent = state.captionSize;
      });
      document.getElementById("framesPerStamp").addEventListener("input", e => {
        state.framesPerStamp = Number(e.target.value);
        document.getElementById("framesVal").textContent = state.framesPerStamp;
      });

      function renderSlotList() {
        const list = document.getElementById("slotList");
        if (!list) return;
        list.innerHTML = "";
        state.slots.forEach((slot, idx) => {
          const card = document.createElement("div");
          card.className = `slot-item${idx === state.selectedSlot ? " selected" : ""}`;
          card.addEventListener("click", () => {
            state.selectedSlot = idx;
            renderSlotList();
          });

          const num = document.createElement("div");
          num.className = "slot-num";
          num.textContent = `#${String(idx + 1).padStart(2, "0")}`;

          const input = document.createElement("input");
          input.type = "text";
          input.value = slot.text;
          input.addEventListener("click", ev => ev.stopPropagation());
          input.addEventListener("input", ev => { slot.text = ev.target.value; });

          const select = document.createElement("select");
          select.addEventListener("click", ev => ev.stopPropagation());
          MOTIONS.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m;
            opt.textContent = MOTION_LABELS[m] || m;
            if (m === slot.motion) opt.selected = true;
            select.appendChild(opt);
          });
          select.addEventListener("change", ev => { slot.motion = ev.target.value; });

          card.appendChild(num);
          card.appendChild(input);
          card.appendChild(select);
          list.appendChild(card);
        });
      }
      renderSlotList();

      function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY;
        return {
          x: ((clientX - rect.left) / (rect.width || 1)) * canvas.width,
          y: ((clientY - rect.top) / (rect.height || 1)) * canvas.height
        };
      }
      function startDrag(e) {
        state.dragging = true;
        const pt = getPointerPos(e);
        state.dragStartX = pt.x - state.posX;
        state.dragStartY = pt.y - state.posY;
      }
      function moveDrag(e) {
        if (!state.dragging) return;
        const pt = getPointerPos(e);
        state.posX = pt.x - state.dragStartX;
        state.posY = pt.y - state.dragStartY;
      }
      function endDrag() { state.dragging = false; }

      canvas.addEventListener("mousedown", startDrag);
      window.addEventListener("mousemove", moveDrag);
      window.addEventListener("mouseup", endDrag);
      canvas.addEventListener("touchstart", startDrag, { passive: true });
      window.addEventListener("touchmove", moveDrag, { passive: true });
      window.addEventListener("touchend", endDrag);

      document.getElementById("togglePlayBtn").addEventListener("click", () => {
        state.isPlaying = !state.isPlaying;
        setStatus(state.isPlaying ? "再生中" : "一時停止中");
      });
      document.getElementById("resetPosBtn").addEventListener("click", () => {
        state.posX = canvas.width / 2;
        state.posY = canvas.height / 2 - 12;
        state.scale = 1.0;
        document.getElementById("scaleRange").value = 100;
        document.getElementById("scaleVal").textContent = "100%";
      });

      function drawFrame(targetCtx, frameIndex, includeGuide) {
        targetCtx.clearRect(0, 0, canvas.width, canvas.height);
        const slot = state.slots[state.selectedSlot] || { text: "", motion: "bounce" };
        const phase = (frameIndex / Math.max(1, state.framesPerStamp)) * Math.PI * 2;
        const amp = state.amp;

        let dx = 0, dy = 0, rot = 0, sx = state.scale, sy = state.scale;
        switch (slot.motion) {
          case "bounce": dy = -Math.abs(Math.sin(phase)) * 18 * amp; break;
          case "bow": rot = Math.sin(phase) * 0.22 * amp; dy = Math.abs(Math.sin(phase)) * 10 * amp; break;
          case "nod": dy = Math.sin(phase * 2) * 8 * amp; rot = Math.sin(phase * 2) * 0.08 * amp; break;
          case "float": dy = Math.sin(phase) * 12 * amp; break;
          case "shock": dx = Math.sin(phase * 6) * 8 * amp; break;
          case "droop": dy = 10 * amp + Math.sin(phase) * 4 * amp; sy = state.scale * (1 - 0.06 * amp); break;
          case "pulse": { const p = 1 + Math.sin(phase) * 0.14 * amp; sx = state.scale * p; sy = state.scale * p; break; }
          case "jelly": sx = state.scale * (1 + Math.sin(phase * 2) * 0.12 * amp); sy = state.scale * (1 - Math.sin(phase * 2) * 0.12 * amp); break;
          case "spin": rot = phase; break;
          case "swing": rot = Math.sin(phase) * 0.25 * amp; break;
          default: dy = -Math.abs(Math.sin(phase)) * 14 * amp;
        }

        if (state.keyedCanvas) {
          const baseSize = Math.min(canvas.width, canvas.height) * 0.56;
          const ratio = state.keyedCanvas.width / (state.keyedCanvas.height || 1);
          const drawW = ratio >= 1 ? baseSize : baseSize * ratio;
          const drawH = ratio >= 1 ? baseSize / ratio : baseSize;

          targetCtx.save();
          targetCtx.translate(state.posX + dx, state.posY + dy);
          targetCtx.rotate(rot);
          targetCtx.scale(sx, sy);
          targetCtx.drawImage(state.keyedCanvas, -drawW / 2, -drawH / 2, drawW, drawH);
          targetCtx.restore();
        } else {
          targetCtx.save();
          targetCtx.fillStyle = "#64748b";
          targetCtx.font = "bold 15px sans-serif";
          targetCtx.textAlign = "center";
          targetCtx.fillText("Step 1 で画像を選択してください", canvas.width / 2, canvas.height / 2 - 10);
          targetCtx.restore();
        }

        if (slot.text) {
          targetCtx.save();
          targetCtx.font = `900 ${state.captionSize}px "Hiragino Sans", "Yu Gothic", sans-serif`;
          targetCtx.textAlign = "center";
          targetCtx.textBaseline = "bottom";
          const textX = canvas.width / 2;
          const textY = canvas.height - 14;
          targetCtx.lineWidth = Math.max(4, Math.round(state.captionSize / 6));
          targetCtx.strokeStyle = "#ffffff";
          targetCtx.strokeText(slot.text, textX, textY);
          targetCtx.fillStyle = state.captionColor;
          targetCtx.fillText(slot.text, textX, textY);
          targetCtx.restore();
        }

        if (includeGuide && state.showMarginGuide) {
          targetCtx.save();
          targetCtx.strokeStyle = "rgba(6, 199, 85, 0.55)";
          targetCtx.setLineDash([5, 4]);
          targetCtx.lineWidth = 1.5;
          targetCtx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
          targetCtx.restore();
        }
      }

      function downloadDataUrl(dataUrl, filename) {
        const a = document.createElement("a");
        a.href = dataUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function exportSlotFrames(slotIndex) {
        state.selectedSlot = slotIndex;
        renderSlotList();
        const total = state.framesPerStamp;
        const prefix = `stamp_${String(slotIndex + 1).padStart(2, "0")}`;
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tctx = tempCanvas.getContext("2d");

        for (let f = 0; f < total; f++) {
          drawFrame(tctx, f, false);
          downloadDataUrl(tempCanvas.toDataURL("image/png"), `${prefix}_f${String(f + 1).padStart(2, "0")}.png`);
        }
        setStatus(`${prefix}（${total}枚）のPNG連番を書き出しました`);
      }

      document.getElementById("exportCurrentBtn").addEventListener("click", () => {
        exportSlotFrames(state.selectedSlot);
      });
      document.getElementById("exportAll40Btn").addEventListener("click", async () => {
        setStatus("全40スロットの書き出しを開始します...");
        for (let i = 0; i < 40; i++) {
          exportSlotFrames(i);
          await new Promise(r => setTimeout(r, 120));
        }
        setStatus("全40スロットの連番PNG書き出しが完了しました！");
      });

      function loop() {
        if (state.isPlaying) state.tick += 0.35 * state.speed;
        drawFrame(ctx, state.tick, true);
        requestAnimationFrame(loop);
      }

      goToStep(1);
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
