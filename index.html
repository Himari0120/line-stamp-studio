<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LINEスタンプメーカー</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;padding:16px 16px 88px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px 4px;border:none;border-radius:8px;background:#334155;color:#fff;font-weight:bold}
.tab.on{background:#06c755}
.box{background:#1e293b;padding:14px;border-radius:12px;margin-bottom:12px}
.panel{display:none}
.panel.on{display:block}
canvas{display:block;width:100%;max-width:340px;margin:0 auto;border-radius:8px;touch-action:manipulation}
.bg-light{background:#f8fafc}
.bg-dark{background:#111827}
.bg-checker{background-color:#e2e8f0;background-image:linear-gradient(45deg,#cbd5e1 25%,transparent 25%),linear-gradient(-45deg,#cbd5e1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cbd5e1 75%),linear-gradient(-45deg,transparent 75%,#cbd5e1 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.btn{padding:11px 14px;border:none;border-radius:8px;background:#06c755;color:#fff;font-weight:bold;font-size:15px}
.btn2{padding:11px 14px;border:none;border-radius:8px;background:#475569;color:#fff;font-weight:bold;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0f172a;padding:10px 16px;display:flex;justify-content:space-between;border-top:1px solid #334155}
input[type="file"],input[type="text"],select{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:none;font-size:16px;box-sizing:border-box;color:#0f172a;background:#fff}
input[type="range"]{width:100%;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
.slot-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.slot-row select{width:auto;min-width:130px;margin-top:0}
.slot-row input{flex:1;min-width:160px;margin-top:0}
.note{font-size:13px;color:#cbd5e1;margin-top:8px;line-height:1.5}
.lbl-block{display:block;margin-top:14px}
.swatch{display:inline-block;width:18px;height:18px;border-radius:4px;border:1px solid #fff;vertical-align:middle;margin-left:6px}
</style>
</head>
<body>
<h3>LINEスタンプメーカー（しぐさ・表情エフェクト）</h3>

<div class="tabs">
  <button type="button" class="tab on" id="tab1" onclick="go(1)">1.画像</button>
  <button type="button" class="tab" id="tab2" onclick="go(2)">2.しぐさ/余白</button>
  <button type="button" class="tab" id="tab3" onclick="go(3)">3.40個/表情</button>
  <button type="button" class="tab" id="tab4" onclick="go(4)">4.サイズ/保存</button>
</div>

<div class="box">
  <canvas id="cv" width="340" height="280" class="bg-checker" onclick="pickCanvasColor(event)"></canvas>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button type="button" class="btn2" onclick="cycleBg()">プレビュー背景切替</button>
    <span id="bgName" style="font-size:13px;color:#cbd5e1">市松模様</span>
    <span id="curBadge" style="font-weight:bold;color:#38bdf8">#01</span>
  </div>
  <p id="info" style="color:#34d399;margin:8px 0 0">ステップ1：画像を選んでください</p>
</div>

<div class="box panel on" id="p1">
  <label>画像を選ぶ</label>
  <input type="file" accept="image/*" onchange="loadPic(this)">

  <label class="chk">
    <input type="checkbox" id="keyOn" checked onchange="makeKey()">
    <span>背景透過を有効にする</span>
  </label>

  <label class="lbl-block">透過する基準色
    <select id="keyMode" onchange="setKeyMode(this.value)">
      <option value="corner" selected>左上（角）の色</option>
      <option value="white">白っぽい背景（255,255,255）</option>
      <option value="black">黒っぽい背景（0,0,0）</option>
      <option value="pick">プレビューをタップして色を抽出</option>
    </select>
  </label>

  <div class="note">
    抽出中の色: <span id="colText">自動</span><span id="colSwatch" class="swatch" style="background:#ffffff"></span>
  </div>

  <label class="lbl-block">透過の強さ（許容値）: <span id="tolLbl">55</span>
    <input type="range" id="tolR" min="0" max="180" value="55" oninput="setTol(this.value)">
  </label>

  <label class="chk">
    <input type="checkbox" id="edgeOnly" checked onchange="makeKey()">
    <span>外周とつながった背景だけを透過する（キャラの目や服の白・黒を守る）</span>
  </label>
</div>

<div class="box panel" id="p2">
  <label>選択中スタンプのしぐさ（動き）</label>
  <select id="act" onchange="setSlotMotion(this.value)">
    <option value="bounce">ぴょん跳ね（元気・挨拶・OK）</option>
    <option value="wave">お手振り（挨拶・またね・よろしく）</option>
    <option value="bow">ぺこりお辞儀（謝罪・感謝・了解）</option>
    <option value="float">ふわふわ（癒やし・リラックス）</option>
    <option value="swing">ゆらゆら（照れ・相談・お願い）</option>
    <option value="jelly">ぷるぷる（驚き・焦り・泣き）</option>
    <option value="pulse">ドキドキ拡大（好き・最高・神）</option>
    <option value="sleepy">うとうと（眠い・おやすみ）</option>
  </select>

  <label class="lbl-block">表情エフェクト</label>
  <select id="emoSel" onchange="setSlotEmotion(this.value)">
    <option value="none">なし</option>
    <option value="sparkle">キラキラ★（元気・嬉しい・最高）</option>
    <option value="heart">ハート♡（好き・感謝・尊い）</option>
    <option value="blush">照れ・赤面☺️（照れ・ふふっ）</option>
    <option value="shock">ショック・汗💦（えっ・ガーン・無理）</option>
    <option value="zzz">うとうと💤（眠い・おやすみ）</option>
  </select>

  <div style="margin-top:10px">
    <button type="button" class="btn2" onclick="applyAutoStyleToCurrent()">今のセリフに合うしぐさ＆表情を自動セット</button>
  </div>

  <label class="lbl-block">キャラの拡大率（%）: <span id="scLbl">100</span>
    <input type="range" id="scR" min="40" max="180" value="100" oninput="setScale(this.value)">
  </label>
  <label class="lbl-block">外側の余白（%）: <span id="padLbl">12</span>
    <input type="range" id="padR" min="4" max="30" value="12" oninput="setPad(this.value)">
  </label>
</div>

<div class="box panel" id="p3">
  <label>スタンプ番号を選ぶ（#01〜#40）</label>
  <select id="slotPick" onchange="pickSlot(this.value)"></select>
  <div class="slot-row">
    <input type="text" id="say" value="おはよう！" oninput="setSlotText(this.value)">
    <select id="slotAct" onchange="setSlotMotion(this.value)">
      <option value="bounce">ぴょん跳ね</option>
      <option value="wave">お手振り</option>
      <option value="bow">ぺこりお辞儀</option>
      <option value="float">ふわふわ</option>
      <option value="swing">ゆらゆら</option>
      <option value="jelly">ぷるぷる</option>
      <option value="pulse">ドキドキ拡大</option>
      <option value="sleepy">うとうと</option>
    </select>
  </div>
  <label class="chk">
    <input type="checkbox" id="autoFitCheck" checked>
    <span>セリフを変えたとき、合うしぐさと表情を自動で選ぶ</span>
  </label>
  <div style="margin-top:10px">
    <button type="button" class="btn2" onclick="applyAutoStyleToAll40()">40個すべてセリフに合うしぐさ＆表情へ自動設定</button>
  </div>
  <label class="lbl-block">文字サイズ（%）: <span id="fntLbl">100</span>
    <input type="range" id="fntR" min="60" max="140" value="100" oninput="setFontScale(this.value)">
  </label>
  <label class="lbl-block">白フチの太さ: <span id="outLbl">8</span>
    <input type="range" id="outR" min="2" max="16" value="8" oninput="setOutline(this.value)">
  </label>
</div>

<div class="box panel" id="p4">
  <label>書き出しサイズ（幅×高さ）</label>
  <select id="outSize" onchange="setOutSize(this.value)">
    <option value="320x270" selected>320 × 270（アニメ目安）</option>
    <option value="370x320">370 × 320（静止画目安）</option>
    <option value="240x240">240 × 240（正方形）</option>
    <option value="512x512">512 × 512（高精細プレビュー・素材用）</option>
  </select>
  <label class="lbl-block">1スタンプあたりの連番枚数</label>
  <select id="frameCnt" onchange="frameTotal=Number(this.value)">
    <option value="4">4枚</option>
    <option value="6" selected>6枚</option>
    <option value="8">8枚</option>
    <option value="10">10枚</option>
  </select>
  <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
    <button type="button" class="btn" onclick="saveCurrentSeq()">選択中（#01〜#40）を連番PNG保存</button>
    <button type="button" class="btn2" id="allBtn" onclick="saveAll40Seq()">全40スタンプを順番に連番PNG保存</button>
  </div>
</div>

<div class="bar">
  <button type="button" class="btn2" onclick="go(cur>1?cur-1:4)">← 前へ</button>
  <button type="button" class="btn" onclick="go(cur<4?cur+1:1)">次へ →</button>
</div>

<script>
var PHRASES=[
  "おはよう！","ありがとう！","了解です！","おつかれさま","おやすみ〜","わーい！！","えっ！？","ごめんなさい","いいね！","よろしくね",
  "はーい！","なるほど！","うそでしょ!?","照れるなぁ","大好き♡","ふふっ♪","最高！！","無理…","ガンバレ！","やったね！",
  "ペコリ","ワクワク","眠い…","ガーン！","OK！","まっててね","急ぎます！","助かりました","神！！","えーん泣",
  "それな！","尊い…","またね〜","おめでとう！","ほっ…","なんでやねん","ぺこぺこ","ルンルン♪","ちーん…","感謝感激！"
];

function guessMotionByText(txt, idx){
  var s=String(txt||"");
  if(/眠|おやすみ/.test(s)) return "sleepy";
  if(/ほっ|ちーん|つかれ|ゆっくり|リラックス/.test(s)) return "float";
  if(/ぺこ|ペコリ|ごめん|謝|了解|助かり|感謝/.test(s)) return "bow";
  if(/またね|はーい|よろしく|バイバイ|挨拶/.test(s)) return "wave";
  if(/好き|大好き|最高|神|尊い|感激|おめでとう/.test(s)) return "pulse";
  if(/えっ|うそ|ガーン|無理|えーん|泣|焦|なんで|びっくり|！？|\?/.test(s)) return "jelly";
  if(/照れ|お願い|まって|相談|♪/.test(s)) return "swing";
  if(/おはよう|わーい|いいね|OK|やった|ガンバレ|ワクワク|急ぎ/.test(s)) return "bounce";
  var fallback=["bounce","wave","bow","float","swing","jelly","pulse","sleepy"];
  return fallback[(idx||0)%fallback.length];
}

function guessEmotionByText(txt){
  var s=String(txt||"");
  if(/眠|おやすみ|ちーん/.test(s)) return "zzz";
  if(/好き|大好き|尊い|感謝|感激|♡|❤|おめでとう/.test(s)) return "heart";
  if(/照れ|ふふ|ぺこ|ペコリ|ごめん/.test(s)) return "blush";
  if(/えっ|うそ|ガーン|無理|えーん|泣|焦|なんで|！？|\?/.test(s)) return "shock";
  if(/おはよう|わーい|最高|神|いいね|やった|ワクワク|ルンルン|★|♪/.test(s)) return "sparkle";
  return "none";
}

function motionLabel(m){
  if(m==="wave") return "お手振り";
  if(m==="bow") return "ぺこりお辞儀";
  if(m==="float") return "ふわふわ";
  if(m==="swing") return "ゆらゆら";
  if(m==="jelly") return "ぷるぷる";
  if(m==="pulse") return "ドキドキ拡大";
  if(m==="sleepy") return "うとうと";
  return "ぴょん跳ね";
}

var slots=[];
for(var i=0;i<40;i++){
  var t0=PHRASES[i]||("スタンプ"+(i+1));
  slots.push({text:t0, motion:guessMotionByText(t0,i), emotion:guessEmotionByText(t0)});
}

var cur=1, sel=0, pic=null, keyPic=null, t=0;
var tolVal=55, keyMode="corner", pickedRgb=null;
var bgModes=["bg-checker","bg-light","bg-dark"], bgLabels=["市松模様","白背景","黒背景"], bgIdx=0;
var scVal=1.0, padPct=12, fontScale=1.0, outlineW=8;
var outW=320, outH=270, frameTotal=6, busyAll=false;

function initSlotSelect(){
  var el=document.getElementById("slotPick");
  el.innerHTML="";
  for(var i=0;i<40;i++){
    var opt=document.createElement("option");
    opt.value=String(i);
    opt.textContent="#"+String(i+1).padStart(2,"0")+" : "+slots[i].text+" ["+motionLabel(slots[i].motion)+"]";
    if(i===sel) opt.selected=true;
    el.appendChild(opt);
  }
  syncSlotControls();
}

function refreshSlotOptionLabel(i){
  var pick=document.getElementById("slotPick");
  if(pick && pick.options[i]){
    pick.options[i].textContent="#"+String(i+1).padStart(2,"0")+" : "+slots[i].text+" ["+motionLabel(slots[i].motion)+"]";
  }
}

function syncSlotControls(){
  var sl=slots[sel];
  document.getElementById("curBadge").textContent="#"+String(sel+1).padStart(2,"0")+"（"+sl.text+"／"+motionLabel(sl.motion)+"）";
  document.getElementById("say").value=sl.text;
  document.getElementById("slotAct").value=sl.motion;
  document.getElementById("act").value=sl.motion;
  document.getElementById("emoSel").value=sl.emotion||"none";
}

function setOutSize(val){
  var parts=String(val).split("x");
  outW=Number(parts[0])||320;
  outH=Number(parts[1])||270;
  document.getElementById("info").textContent="書き出しサイズを "+outW+"×"+outH+" に設定しました";
}

function pickSlot(idxStr){
  sel=Math.max(0,Math.min(39,Number(idxStr)||0));
  syncSlotControls();
  document.getElementById("info").textContent="#"+String(sel+1).padStart(2,"0")+" を選択中";
}

function setSlotText(v){
  slots[sel].text=v;
  var autoChk=document.getElementById("autoFitCheck");
  if(autoChk && autoChk.checked){
    slots[sel].motion=guessMotionByText(v,sel);
    slots[sel].emotion=guessEmotionByText(v);
  }
  refreshSlotOptionLabel(sel);
  syncSlotControls();
}

function setSlotMotion(m){
  slots[sel].motion=m;
  refreshSlotOptionLabel(sel);
  syncSlotControls();
}

function setSlotEmotion(e){
  slots[sel].emotion=e;
  syncSlotControls();
}

function applyAutoStyleToCurrent(){
  var m=guessMotionByText(slots[sel].text,sel);
  var e=guessEmotionByText(slots[sel].text);
  slots[sel].motion=m;
  slots[sel].emotion=e;
  refreshSlotOptionLabel(sel);
  syncSlotControls();
  document.getElementById("info").textContent="#"+String(sel+1).padStart(2,"0")+" に「"+motionLabel(m)+"」と表情を設定しました";
}

function applyAutoStyleToAll40(){
  for(var i=0;i<40;i++){
    slots[i].motion=guessMotionByText(slots[i].text,i);
    slots[i].emotion=guessEmotionByText(slots[i].text);
    refreshSlotOptionLabel(i);
  }
  syncSlotControls();
  document.getElementById("info").textContent="40個すべてに合うしぐさと表情を自動設定しました";
}

function go(n){
  cur=n;
  for(var i=1;i<=4;i++){
    document.getElementById("tab"+i).className=(i===n)?"tab on":"tab";
    document.getElementById("p"+i).className=(i===n)?"box panel on":"box panel";
  }
  syncSlotControls();
  document.getElementById("info").textContent="ステップ"+n+"を表示中";
}

function cycleBg(){
  bgIdx=(bgIdx+1)%bgModes.length;
  document.getElementById("cv").className=bgModes[bgIdx];
  document.getElementById("bgName").textContent=bgLabels[bgIdx];
}

function setScale(v){
  scVal=Number(v)/100;
  document.getElementById("scLbl").textContent=v;
}

function setPad(v){
  padPct=Number(v);
  document.getElementById("padLbl").textContent=v;
}

function setFontScale(v){
  fontScale=Number(v)/100;
  document.getElementById("fntLbl").textContent=v;
}

function setOutline(v){
  outlineW=Number(v);
  document.getElementById("outLbl").textContent=v;
}

function setKeyMode(m){
  keyMode=m;
  if(m==="pick"){
    document.getElementById("info").textContent="プレビュー上の透過したい背景色をタップしてください";
  }
  makeKey();
}

function pickCanvasColor(ev){
  if(keyMode!=="pick" || !pic) return;
  try{
    var cv=document.getElementById("cv");
    var rect=cv.getBoundingClientRect();
    var scaleX=cv.width/(rect.width||1);
    var scaleY=cv.height/(rect.height||1);
    var cx=Math.floor((ev.clientX-rect.left)*scaleX);
    var cy=Math.floor((ev.clientY-rect.top)*scaleY);
    var tmp=document.createElement("canvas");
    tmp.width=pic.naturalWidth||pic.width;
    tmp.height=pic.naturalHeight||pic.height;
    var tctx=tmp.getContext("2d");
    tctx.drawImage(pic,0,0);
    var px=Math.max(0,Math.min(tmp.width-1,Math.floor((cx/cv.width)*tmp.width)));
    var py=Math.max(0,Math.min(tmp.height-1,Math.floor((cy/cv.height)*tmp.height)));
    var p=tctx.getImageData(px,py,1,1).data;
    pickedRgb=[p[0],p[1],p[2]];
    makeKey();
  }catch(e){}
}

function updateSwatch(rgb){
  var hex="rgb("+rgb[0]+","+rgb[1]+","+rgb[2]+")";
  document.getElementById("colText").textContent=hex;
  document.getElementById("colSwatch").style.background=hex;
}

function makeKey(){
  if(!pic){keyPic=null;return;}
  var on=document.getElementById("keyOn").checked;
  if(!on){keyPic=null;document.getElementById("info").textContent="透過OFFで表示中";return;}
  try{
    var w=pic.naturalWidth||pic.width;
    var h=pic.naturalHeight||pic.height;
    var off=document.createElement("canvas");
    off.width=w;
    off.height=h;
    var o=off.getContext("2d");
    o.drawImage(pic,0,0);
    var id=o.getImageData(0,0,w,h), d=id.data;

    var base=[d[0],d[1],d[2]];
    if(keyMode==="white") base=[255,255,255];
    else if(keyMode==="black") base=[0,0,0];
    else if(keyMode==="pick" && pickedRgb) base=pickedRgb;
    updateSwatch(base);

    var lim=Number(tolVal);
    var onlyEdge=document.getElementById("edgeOnly").checked;
    var totalPx=w*h;
    var match=new Uint8Array(totalPx);

    for(var p=0;p<totalPx;p++){
      var idx=p*4;
      if(Math.abs(d[idx]-base[0])<=lim && Math.abs(d[idx+1]-base[1])<=lim && Math.abs(d[idx+2]-base[2])<=lim){
        match[p]=1;
      }
    }

    var hit=0;
    if(!onlyEdge){
      for(var p=0;p<totalPx;p++){
        if(match[p]){d[p*4+3]=0;hit++;}
      }
    }else{
      var vis=new Uint8Array(totalPx);
      var queue=new Int32Array(totalPx);
      var head=0, tail=0;
      for(var x=0;x<w;x++){
        var top=x, bot=(h-1)*w+x;
        if(match[top] && !vis[top]){vis[top]=1;queue[tail++]=top;}
        if(match[bot] && !vis[bot]){vis[bot]=1;queue[tail++]=bot;}
      }
      for(var y=0;y<h;y++){
        var left=y*w, right=y*w+(w-1);
        if(match[left] && !vis[left]){vis[left]=1;queue[tail++]=left;}
        if(match[right] && !vis[right]){vis[right]=1;queue[tail++]=right;}
      }
      while(head<tail){
        var curP=queue[head++];
        var cx=curP%w, cy=(curP-cx)/w;
        var nbs=[
          cx>0 ? curP-1 : -1,
          cx<w-1 ? curP+1 : -1,
          cy>0 ? curP-w : -1,
          cy<h-1 ? curP+w : -1
        ];
        for(var k=0;k<4;k++){
          var np=nbs[k];
          if(np>=0 && !vis[np] && match[np]){
            vis[np]=1;
            queue[tail++]=np;
          }
        }
      }
      for(var p=0;p<totalPx;p++){
        if(vis[p]){d[p*4+3]=0;hit++;}
      }
    }

    o.putImageData(id,0,0);
    keyPic=off;
    var pct=Math.round((hit/totalPx)*100);
    document.getElementById("info").textContent="透過処理完了（約"+pct+"%のピクセルを透過）";
  }catch(err){
    keyPic=null;
    document.getElementById("info").textContent="透過できませんでした: "+err.message;
  }
}

function setTol(v){
  tolVal=Number(v);
  document.getElementById("tolLbl").textContent=v;
  makeKey();
}

function loadPic(inp){
  if(!inp.files||!inp.files[0])return;
  var f=inp.files[0], r=new FileReader();
  r.onload=function(e){
    var im=new Image();
    im.onload=function(){
      pic=im;
      makeKey();
      if(!keyPic){
        document.getElementById("info").textContent="読み込みOK（元画像を表示）: "+f.name;
      }
    };
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}

function drawEmotionOverlay(ctx, cx, cy, boxW, boxH, phase, emo, scaleRatio){
  if(!emo || emo==="none") return;
  var s=scaleRatio;
  ctx.save();
  if(emo==="sparkle"){
    var bob=Math.sin(phase*2)*4*s;
    ctx.font="bold "+Math.round(20*s)+"px sans-serif";
    ctx.textAlign="center";
    ctx.fillStyle="#facc15";
    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=Math.max(2,3*s);
    var p1x=cx - boxW*0.42, p1y=cy - boxH*0.35 + bob;
    var p2x=cx + boxW*0.42, p2y=cy - boxH*0.25 - bob;
    ctx.strokeText("★",p1x,p1y); ctx.fillText("★",p1x,p1y);
    ctx.strokeText("✦",p2x,p2y); ctx.fillText("✦",p2x,p2y);
  }else if(emo==="heart"){
    var beat=1+Math.sin(phase*2)*0.18;
    ctx.font="bold "+Math.round(22*s*beat)+"px sans-serif";
    ctx.textAlign="center";
    ctx.fillStyle="#fb7185";
    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=Math.max(2,3*s);
    var hx=cx + boxW*0.38, hy=cy - boxH*0.34 - Math.abs(Math.sin(phase))*5*s;
    ctx.strokeText("♡",hx,hy); ctx.fillText("♡",hx,hy);
  }else if(emo==="blush"){
    var rW=13*s, rH=6*s;
    ctx.fillStyle="rgba(244,114,182,0.55)";
    ctx.beginPath();
    ctx.ellipse(cx - boxW*0.22, cy + boxH*0.04, rW, rH, 0, 0, Math.PI*2);
    ctx.ellipse(cx + boxW*0.22, cy + boxH*0.04, rW, rH, 0, 0, Math.PI*2);
    ctx.fill();
  }else if(emo==="shock"){
    var dropY=cy - boxH*0.28 + ((phase*10*s)%(18*s));
    ctx.fillStyle="#38bdf8";
    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=Math.max(2,2.5*s);
    ctx.beginPath();
    ctx.ellipse(cx + boxW*0.36, dropY, 4.5*s, 7*s, 0.2, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.font="900 "+Math.round(18*s)+"px sans-serif";
    ctx.fillStyle="#ef4444";
    ctx.strokeText("!", cx - boxW*0.4, cy - boxH*0.3);
    ctx.fillText("!", cx - boxW*0.4, cy - boxH*0.3);
  }else if(emo==="zzz"){
    var zLift=((phase*8*s)%(20*s));
    ctx.font="bold "+Math.round(16*s)+"px sans-serif";
    ctx.fillStyle="#818cf8";
    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=Math.max(2,3*s);
    var zx=cx + boxW*0.35 + zLift*0.4, zy=cy - boxH*0.3 - zLift;
    ctx.strokeText("zZz",zx,zy); ctx.fillText("zZz",zx,zy);
  }
  ctx.restore();
}

function renderFrame(ctx, wCanvas, hCanvas, phase, slotIdx, forceLightText){
  ctx.clearRect(0,0,wCanvas,hCanvas);
  var sl=slots[slotIdx]||{text:"",motion:"bounce",emotion:"none"};
  var scaleRatio=Math.min(wCanvas/340, hCanvas/280);

  var padX=wCanvas*(padPct/100);
  var padY=hCanvas*(padPct/100);
  var textReserve=(sl.text ? hCanvas*0.22 : 0);
  var availW=Math.max(40, wCanvas - padX*2);
  var availH=Math.max(40, hCanvas - padY*2 - textReserve);

  var dx=0, dy=0, rot=0, sx=scVal, sy=scVal;
  var ampY=14*scaleRatio;
  var ampFloat=10*scaleRatio;

  if(sl.motion==="bounce"){
    dy=-Math.abs(Math.sin(phase))*ampY;
  }else if(sl.motion==="wave"){
    rot=Math.sin(phase*1.5)*0.16;
    dx=Math.sin(phase*1.5)*6*scaleRatio;
  }else if(sl.motion==="bow"){
    var nod=Math.max(0,Math.sin(phase));
    dy=nod*9*scaleRatio;
    rot=nod*0.18;
    sy=scVal*(1 - nod*0.08);
    sx=scVal*(1 + nod*0.05);
  }else if(sl.motion==="float"){
    dy=Math.sin(phase)*ampFloat;
  }else if(sl.motion==="swing"){
    rot=Math.sin(phase)*0.22;
  }else if(sl.motion==="jelly"){
    sx=scVal*(1+Math.sin(phase*2)*0.14);
    sy=scVal*(1-Math.sin(phase*2)*0.14);
  }else if(sl.motion==="pulse"){
    var p=1+Math.sin(phase)*0.14;
    sx=scVal*p;
    sy=scVal*p;
  }else if(sl.motion==="sleepy"){
    var breathe=Math.sin(phase*0.8);
    dy=breathe*4*scaleRatio;
    rot=0.08 + breathe*0.05;
    sy=scVal*(1 - Math.abs(breathe)*0.04);
  }

  var centerX=wCanvas/2;
  var centerY=padY + availH/2 + ampY*0.35;

  var showPic=keyPic||pic;
  if(showPic){
    var iw=showPic.width||1, ih=showPic.height||1;
    var fitScale=Math.min(availW/iw, availH/ih);
    var drawW=iw*fitScale;
    var drawH=ih*fitScale;
    ctx.save();
    ctx.translate(centerX+dx, centerY+dy);
    ctx.rotate(rot);
    ctx.scale(sx, sy);
    ctx.drawImage(showPic, -drawW/2, -drawH/2, drawW, drawH);
    ctx.restore();

    drawEmotionOverlay(ctx, centerX+dx, centerY+dy, drawW*sx, drawH*sy, phase, sl.emotion, scaleRatio);
  }else{
    ctx.fillStyle="#64748b";
    ctx.font="bold "+Math.max(12,Math.round(14*scaleRatio))+"px sans-serif";
    ctx.textAlign="center";
    ctx.fillText("1.画像 から画像を選んでね", centerX, centerY);
  }

  if(sl.text){
    var fSize=Math.max(14, Math.round(26*scaleRatio*fontScale));
    var strokePx=Math.max(2, Math.round(outlineW*scaleRatio));
    var textY=hCanvas - Math.max(8, padY*0.55);
    ctx.save();
    ctx.font="900 "+fSize+"px sans-serif";
    ctx.textAlign="center";
    ctx.textBaseline="alphabetic";
    ctx.lineJoin="round";
    ctx.lineWidth=strokePx;
    ctx.strokeStyle="#ffffff";
    ctx.strokeText(sl.text, centerX, textY);
    ctx.fillStyle=(!forceLightText && bgModes[bgIdx]==="bg-dark")?"#ffffff":"#0f172a";
    ctx.fillText(sl.text, centerX, textY);
    ctx.restore();
  }
}

function downloadDataUrl(url, filename){
  var a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function saveSlotSeq(slotIdx){
  var total=Math.max(2,Number(frameTotal)||6);
  var off=document.createElement("canvas");
  off.width=outW;
  off.height=outH;
  var octx=off.getContext("2d");
  var prefix="stamp_"+String(slotIdx+1).padStart(2,"0")+"_"+outW+"x"+outH;
  for(var f=0;f<total;f++){
    var ph=(f/total)*Math.PI*2;
    renderFrame(octx,outW,outH,ph,slotIdx,true);
    var fname=prefix+"_f"+String(f+1).padStart(2,"0")+".png";
    downloadDataUrl(off.toDataURL("image/png"),fname);
  }
}

function saveCurrentSeq(){
  saveSlotSeq(sel);
  document.getElementById("info").textContent="#"+String(sel+1).padStart(2,"0")+"（"+outW+"×"+outH+"）の連番PNG（"+frameTotal+"枚）を保存しました";
}

function saveAll40Seq(){
  if(busyAll) return;
  busyAll=true;
  var btn=document.getElementById("allBtn");
  btn.disabled=true;
  var idx=0;
  function stepNext(){
    if(idx>=40){
      busyAll=false;
      btn.disabled=false;
      document.getElementById("info").textContent="全40スタンプ（"+outW+"×"+outH+"）の連番PNG書き出しが完了しました！";
      return;
    }
    sel=idx;
    syncSlotControls();
    saveSlotSeq(idx);
    document.getElementById("info").textContent="書き出し中: #"+String(idx+1).padStart(2,"0")+" / 40";
    idx++;
    setTimeout(stepNext, 220);
  }
  stepNext();
}

function loop(){
  var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
  t+=0.1;
  renderFrame(ctx,cv.width,cv.height,t,sel,false);
  requestAnimationFrame(loop);
}

initSlotSelect();
loop();
</script>
