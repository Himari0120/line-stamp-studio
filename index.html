<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>クリックテスト2</title>
</head>
<body style="background:#0f172a;color:#fff;font-family:sans-serif;padding:20px;">
  <h2 id="stepLabel">現在のステップ: 1</h2>
  <p id="msg">ボタンを押してください</p>
  <button type="button" onclick="var n=document.getElementById('stepLabel');var m=document.getElementById('msg');n.textContent='現在のステップ: 2';m.textContent='直接onclickで押せました！';" style="padding:16px 28px;font-size:18px;background:#06c755;color:#fff;border:none;border-radius:8px;">次へ →</button>
</body>
</html>
