<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LINE 40-Stamp Motion Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-light: #334155;
      --accent: #06c755;
      --accent-hover: #05b34c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 72px;
    }
    header {
      background: var(--panel);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    header h1 {
      font-size: 0.98rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: bold;
    }

    /* ウィザード・ステップバー */
    .stepper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 8px 10px;
      background: #131c31;
      border-bottom: 1px solid var(--border);
    }
    .step-tab {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 4px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .step-tab .step-num {
      display: inline-block;
      width: 18px;
      height: 18px;
      line-height: 18px;
      border-radius: 50%;
      background: var(--panel-light);
      color: var(--text);
      font-size: 0.68rem;
    }
    .step-tab.active {
      border-color: var(--accent);
      background: #064e3b;
      color: #fff;
    }
    .step-tab.active .step-num {
      background: var(--accent);
      color: #fff;
    }
    .step-tab.done .step-num {
      background: #10b981;
      color: #fff;
    }

    /* メインレイアウト */
    .main-container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 12px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 860px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    /* 常時表示プレビューカード */
    .preview-card {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 8px;
      z-index: 10;
    }
    @media (max-width: 860px) {
      .preview-card {
        position: relative;
        top: 0;
      }
    }
    .canvas-checker {
      background-image:
        linear-gradient(45deg, #cbd5e1 25%, transparent 25%),
        linear-gradient(-45deg, #cbd5e1 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #cbd5e1 75%),
        linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-color: #f1f5f9;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      line-height: 0;
      touch-action: none;
    }
    canvas {
      max-width: 100%;
      height: auto;
      cursor: grab;
      touch-action: none;
    }

    /* ステップパネル */
    .wizard-panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.2s ease;
    }
    .wizard-panel.active {
      display: flex;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .step-header h2 {
      font-size: 1rem;
      margin: 0
